name: Update dynamic blocklist

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and validate HaGeZi data
        run: node tools/update-blocklist.js
      - name: Publish feed to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blocklist.txt docs/feed/blocklist.json
          if git diff --cached --quiet; then
            echo "Blocklist is unchanged."
          else
            git commit -m "chore: update dynamic blocklist" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          fi
      - name: Rebuild legacy GitHub Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
